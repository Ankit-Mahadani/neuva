[build-system]
requires = ["setuptools>=61,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuva-lang"
version = "1.0.0"
description = "Neuva — A working ML programming language with lexer, parser, AST and interpreter"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "lark>=1.1",
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
]
keywords = ["machine-learning", "programming-language", "neural-network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
neuva = "neuva.cli:main"

[project.urls]
Homepage = "https://github.com/Ankit-Mahadani/neuva"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuva*"]

[tool.setuptools.package-data]
"neuva" = ["parser/*.lark"]
