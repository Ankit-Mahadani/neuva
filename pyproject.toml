[build-system]
requires = ["setuptools>=61,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuva-lang"
version = "0.0.1"
description = "Neuva — A programming language built for Machine Learning"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["machine-learning", "programming-language", "neural-network"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.10",
]

[project.urls]
Homepage = "https://github.com/Ankit-Mahadani/neuva"