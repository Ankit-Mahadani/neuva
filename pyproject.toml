[build-system]
requires = ["setuptools>=61,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuva-lang"
version = "0.3.0"
description = "Neuva — A working ML programming language with lexer, parser, AST and interpreter"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["lark>=1.1"]
keywords = ["machine-learning", "programming-language", "neural-network"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.10",
]

[project.scripts]
neuva = "neuva.cli:main"

[project.urls]
Homepage = "https://github.com/Ankit-Mahadani/neuva"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuva*"]

[tool.setuptools.package-data]
"neuva" = ["parser/*.lark"]